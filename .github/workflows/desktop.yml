name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach to an existing release tag (optional)"
        required: false
        type: string
  workflow_call:
    inputs:
      release_draft:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: windows-x64, os: windows-2022 }
          - { name: linux-x64, os: ubuntu-22.04 }
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Require an existing release for manual attachment
        shell: bash
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install Python sidecar build dependencies
        run: uv sync --extra build
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci
      - name: Run Electron unit tests
        working-directory: electron
        run: npm test
      - name: Prepare compact offline runtime (proxy engine + GeoIP)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/prepare_bundled_runtime.py
      - name: Build static WebUI and slim Python sidecar
        run: uv run --no-sync python scripts/build_desktop.py --sidecar-only --skip-runtime
      - name: Verify sidecar self-check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/prism-backend/prism-backend.exe --self-check
          else
            ./build/prism-backend/prism-backend --self-check
          fi
      - name: Package Electron desktop installer
        run: uv run --no-sync python scripts/build_desktop.py --package-only
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prism-browser-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
      - name: Attach installers to release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          draft: ${{ inputs.release_draft || false }}
          prerelease: ${{ contains(inputs.release_tag, '-') }}
          make_latest: ${{ contains(inputs.release_tag, '-') && 'false' || 'legacy' }}
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
