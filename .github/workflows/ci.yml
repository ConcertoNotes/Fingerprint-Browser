name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src cloud_server tests scripts/prepare_bundled_runtime.py scripts/build_desktop.py scripts/build_webui.py
      - name: Format
        run: uv run ruff format --check src cloud_server tests scripts/prepare_bundled_runtime.py scripts/build_desktop.py scripts/build_webui.py
      - name: Type-check
        run: uv run mypy src/camoufox_pm cloud_server
      - name: Test
        run: uv run pytest --no-network -m "not mihomo" --cov --cov-report=term-missing -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning -o faulthandler_timeout=300 -o faulthandler_exit_on_timeout=true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build (static export)
        run: npm run build:static
        env:
          NEXT_EXPORT: "1"
      - name: Verify static export output
        run: test -f out/index.html

  electron:
    name: Electron Shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
