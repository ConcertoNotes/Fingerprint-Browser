[project]
name = "camoufox-profile-manager"
version = "0.6.0"
description = "棱镜浏览器 (Prism Browser): local-first isolated antidetect browser manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ConcertoNotes" }, { name = "Camoufox Profile Manager Contributors" }]
keywords = [
    "antidetect",
    "browser-fingerprint",
    "chromium",
    "electron",
    "fastapi",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "maxminddb>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1",
    "cryptography>=44.0",
    # Clash/Mihomo subscription YAML; parsed only with the safe loader.
    "pyyaml>=6.0",
    "loguru>=0.7",
    "psutil>=6.1",
    # socks so a SOCKS5 proxy can be checked, not only HTTP ones.
    "httpx[socks]>=0.28",
    # Public trace events own orphaned SOCKS streams; upgrade with lifecycle tests.
    "httpcore==1.0.9",
    "packaging>=24.1",
    "zstandard>=0.23",
    "async-timeout>=5,<6 ; python_full_version < '3.11'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
camoufox-pm = "camoufox_pm.cli:main"
prism-backend = "camoufox_pm.sidecar:main"
prism-cloud-server = "cloud_server.app:main"
lulu-cloud-server = "cloud_server.app:main"

[project.urls]
Homepage = "https://github.com/ConcertoNotes/Fingerprint-Browser"
Repository = "https://github.com/ConcertoNotes/Fingerprint-Browser"
Upstream = "https://github.com/polyackiy/camoufox-profile-manager"
Issues = "https://github.com/ConcertoNotes/Fingerprint-Browser/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camoufox_pm", "cloud_server"]
# The bundled web UI is generated (scripts/build_webui.py) and git-ignored, so
# include it explicitly when building a wheel.
artifacts = [
    "src/camoufox_pm/webui/**",
]

[tool.hatch.build.targets.sdist]
# Ship source only — keep the huge web/electron build artifacts out of the sdist.
exclude = [
    "/web/node_modules",
    "/web/.next",
    "/web/out",
    "/electron/node_modules",
    "/src/camoufox_pm/webui",
    "/dist",
    "/build",
    "/.venv",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/data",
    "/demo_data",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "cloud_server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: real Camoufox launch (opt-in, slow, requires 'camoufox fetch')",
    "mihomo: real Mihomo engine (scripts/prepare_mihomo.py or CPM_MIHOMO_PATH); fails, never skips, without one",
]

[tool.mypy]
packages = ["camoufox_pm"]
ignore_missing_imports = true
# Check our code only; third-party stubs (numpy via camoufox) can use newer syntax.
follow_imports = "silent"

[tool.coverage.run]
source = ["src/camoufox_pm"]
